<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMP Practice Test — 587 Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface2: #eef1f8;
    --border: #d5dce8;
    --text: #1a2236;
    --muted: #7a8aaa;
    --accent: #2563eb;
    --accent2: #1d4ed8;
    --green: #16a34a;
    --red: #dc2626;
    --yellow: #d97706;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f4f6fb;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 40% at 20% 10%, rgba(37,99,235,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(29,78,216,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── HOME ── */
  #screen-home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    position: relative;
    z-index: 1;
  }
  .home-card {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }
  .home-badge {
    display: inline-block;
    background: rgba(37,99,235,0.1);
    color: var(--accent);
    border: 1px solid rgba(37,99,235,0.25);
    border-radius: 99px;
    padding: 0.3rem 1rem;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }
  .home-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.4rem, 5vw, 3.2rem);
    color: #111827;
    line-height: 1.1;
    margin-bottom: 0.7rem;
  }
  .home-title em {
    font-style: italic;
    color: var(--accent2);
  }
  .home-sub {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 2.5rem;
    line-height: 1.6;
  }
  .size-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 1.2rem;
  }
  .size-btn {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 0.85rem 0.5rem;
    border-radius: var(--radius);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .size-btn small { font-size: 0.7rem; color: var(--muted); font-family: 'DM Sans', sans-serif; }
  .size-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(59,123,255,0.25);
  }
  .size-btn:hover small { color: rgba(255,255,255,0.7); }
  .custom-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .custom-input {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 0.75rem 1rem;
    border-radius: var(--radius);
    font-size: 1rem;
    font-family: 'DM Mono', monospace;
    outline: none;
    transition: border-color 0.15s;
  }
  .custom-input:focus { border-color: var(--accent); }
  .custom-btn {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 0.75rem 1.4rem;
    border-radius: var(--radius);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .custom-btn:hover { background: #2d6fe8; box-shadow: 0 6px 20px rgba(59,123,255,0.3); }
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 2rem;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    text-align: center;
  }
  .stat-icon { font-size: 1.4rem; margin-bottom: 4px; }
  .stat-label { font-size: 0.8rem; color: var(--muted); }
  .stat-val { font-size: 1.1rem; font-weight: 600; color: var(--text); }

  /* ── QUIZ ── */
  #screen-quiz {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }
  .quiz-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(244,246,251,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .progress-bar-wrap {
    flex: 1;
    height: 5px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #8b6fff);
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .q-counter {
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .timer-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.3rem 0.75rem;
  }
  .timer-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    transition: background 0.5s;
  }
  #timer-display {
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--green);
    transition: color 0.5s;
    min-width: 45px;
  }
  .quiz-body {
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 2rem 1.25rem 8rem;
  }
  .q-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .q-num-badge {
    background: rgba(37,99,235,0.1);
    color: var(--accent2);
    border: 1px solid rgba(37,99,235,0.2);
    border-radius: 6px;
    padding: 0.15rem 0.6rem;
    font-size: 0.75rem;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
  }
  .multi-badge {
    background: rgba(109,40,217,0.08);
    color: #6d28d9;
    border: 1px solid rgba(109,40,217,0.2);
    border-radius: 6px;
    padding: 0.15rem 0.6rem;
    font-size: 0.72rem;
    font-weight: 600;
  }
  #question-text {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1rem, 2.2vw, 1.15rem);
    line-height: 1.7;
    color: #1a2236;
    margin-bottom: 1.75rem;
  }
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 1.5rem;
  }
  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 1rem 1.1rem;
    border-radius: var(--radius);
    cursor: pointer;
    text-align: left;
    font-size: 0.95rem;
    line-height: 1.55;
    transition: all 0.16s;
    width: 100%;
    font-family: 'DM Sans', sans-serif;
  }
  .option-btn:hover:not(.confirmed) {
    background: #eff6ff;
    border-color: var(--accent);
    transform: translateX(3px);
  }
  .option-btn.selected:not(.confirmed) {
    background: #dbeafe;
    border-color: var(--accent);
    color: #1e3a8a;
  }
  .option-btn.correct {
    background: #dcfce7;
    border-color: var(--green);
    color: #14532d;
  }
  .option-btn.wrong {
    background: #fee2e2;
    border-color: var(--red);
    color: #7f1d1d;
  }
  .option-btn.dimmed {
    opacity: 0.4;
    cursor: default;
  }
  .opt-key {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 0.9rem;
    min-width: 22px;
    padding-top: 1px;
    color: var(--muted);
    transition: color 0.16s;
  }
  .option-btn.selected:not(.confirmed) .opt-key,
  .option-btn.correct .opt-key { color: inherit; }
  .opt-icon {
    margin-left: auto;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .action-row {
    display: flex;
    gap: 10px;
  }
  .btn-confirm {
    flex: 1;
    padding: 1rem;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-confirm:disabled {
    background: var(--surface2);
    color: var(--muted);
    cursor: not-allowed;
  }
  .btn-confirm:not(:disabled):hover {
    background: #2d6fe8;
    box-shadow: 0 6px 20px rgba(59,123,255,0.3);
    transform: translateY(-1px);
  }
  .btn-next {
    flex: 1;
    padding: 1rem;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-next:hover {
    background: #2d6fe8;
    box-shadow: 0 6px 20px rgba(59,123,255,0.3);
    transform: translateY(-1px);
  }
  .btn-skip {
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-skip:hover { color: var(--text); border-color: var(--muted); }
  .explanation-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 1.2rem;
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .expl-toggle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1rem;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    width: 100%;
    font-size: 0.88rem;
    font-family: 'DM Sans', sans-serif;
    transition: color 0.15s;
  }
  .expl-toggle:hover { color: var(--text); }
  .expl-body {
    padding: 0.25rem 1rem 1rem;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.65;
    border-top: 1px solid var(--border);
    display: none;
  }
  .expl-body.open { display: block; }

  /* ── RESULTS ── */
  #screen-results {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    position: relative;
    z-index: 1;
  }
  .results-card {
    max-width: 540px;
    width: 100%;
    text-align: center;
  }
  .score-ring {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 5px solid var(--border);
    position: relative;
    background: var(--surface);
  }
  .score-pct {
    font-family: 'DM Mono', monospace;
    font-size: 2.4rem;
    font-weight: 500;
    line-height: 1;
  }
  .score-label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 3px;
  }
  .grade-badge {
    display: inline-block;
    border-radius: 8px;
    padding: 0.35rem 1.2rem;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    margin-bottom: 1.5rem;
  }
  .results-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 2rem;
  }
  .result-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
  }
  .result-num {
    font-family: 'DM Mono', monospace;
    font-size: 1.8rem;
    font-weight: 500;
    line-height: 1;
  }
  .result-sub { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
  .results-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .btn-home {
    padding: 0.85rem 1.8rem;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-home:hover { border-color: var(--accent); color: var(--accent2); }
  .btn-retry {
    padding: 0.85rem 1.8rem;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-retry:hover { background: #2d6fe8; box-shadow: 0 6px 20px rgba(59,123,255,0.3); }

  /* Loading overlay */
  #loading {
    position: fixed;
    inset: 0;
    background: #f4f6fb;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
  }
  #loading p { color: var(--muted); font-size: 0.9rem; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .size-grid { grid-template-columns: repeat(2, 1fr); }
    .stats-row { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p style="color:#7a8aaa">Loading 587 questions…</p></div>

<!-- HOME -->
<div id="screen-home" style="display:none">
  <div class="home-card">
    <div class="home-badge">PMP® Exam Prep</div>
    <h1 class="home-title">Practice<br><em>Test</em></h1>
    <p class="home-sub">587 questions from your exam dump.<br>Timed, graded, with answer explanations.</p>

    <div class="size-grid">
      <button class="size-btn" onclick="startQuiz(10)">10<small>Quick</small></button>
      <button class="size-btn" onclick="startQuiz(20)">20<small>Short</small></button>
      <button class="size-btn" onclick="startQuiz(40)">40<small>Medium</small></button>
      <button class="size-btn" onclick="startQuiz(60)">60<small>Long</small></button>
      <button class="size-btn" onclick="startQuiz(120)">120<small>Half</small></button>
      <button class="size-btn" onclick="startQuiz(180)">180<small>Full</small></button>
      <button class="size-btn" onclick="startQuiz(587)" style="grid-column:span 2">587<small>All Questions</small></button>
    </div>
    <div class="custom-row">
      <input class="custom-input" type="number" id="custom-size" value="30" min="5" max="587" placeholder="Custom count">
      <button class="custom-btn" onclick="startQuiz(parseInt(document.getElementById('custom-size').value)||30)">Start Custom →</button>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-icon">⏱</div><div class="stat-val">72s</div><div class="stat-label">Per question</div></div>
      <div class="stat-card"><div class="stat-icon">✓</div><div class="stat-val">≥80%</div><div class="stat-label">To pass</div></div>
      <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-val">587</div><div class="stat-label">Questions</div></div>
    </div>
  </div>
</div>

<!-- QUIZ -->
<div id="screen-quiz">
  <div class="quiz-header">
    <div class="progress-bar-wrap"><div id="progress-bar"></div></div>
    <span class="q-counter" id="q-counter">1 / 20</span>
    <div class="timer-pill">
      <div class="timer-dot" id="timer-dot"></div>
      <span id="timer-display">00:00</span>
    </div>
  </div>
  <div class="quiz-body">
    <div class="q-meta">
      <span class="q-num-badge" id="q-num-badge">Q1</span>
      <span class="multi-badge" id="multi-badge" style="display:none">Select all that apply</span>
    </div>
    <p id="question-text"></p>
    <div class="options-list" id="options-list"></div>
    <div id="explanation-wrap"></div>
    <div class="action-row" id="action-row"></div>
  </div>
</div>

<!-- RESULTS -->
<div id="screen-results">
  <div class="results-card">
    <div class="score-ring" id="score-ring">
      <div class="score-pct" id="score-pct" style="color:#1a2236">--</div>
      <div class="score-label">Score</div>
    </div>
    <div class="grade-badge" id="grade-badge">--</div>
    <div class="results-grid">
      <div class="result-cell"><div class="result-num" id="r-correct" style="color:var(--green)">0</div><div class="result-sub">Correct</div></div>
      <div class="result-cell"><div class="result-num" id="r-wrong" style="color:var(--red)">0</div><div class="result-sub">Wrong</div></div>
      <div class="result-cell"><div class="result-num" id="r-total" style="color:var(--muted)">0</div><div class="result-sub">Total</div></div>
    </div>
    <div class="results-actions">
      <button class="btn-home" onclick="showHome()">← Home</button>
      <button class="btn-retry" id="btn-retry">Retry ↺</button>
    </div>
  </div>
</div>

// Decode and parse
async function loadQuestions() {
  const bin = atob(DATA_B64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const out = await new Response(ds.readable).text();
  return JSON.parse(out);
}

// ── STATE ──
let ALL_Q = [];
let questions = [], current = 0, selected = null, confirmed = false;
let answers = [], timeLeft = 0, timerID = null;
let lastSize = 20;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmt(s) {
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function startQuiz(size) {
  size = Math.max(1, Math.min(size, ALL_Q.length));
  lastSize = size;
  questions = shuffle(ALL_Q).slice(0, size);
  current = 0; selected = null; confirmed = false; answers = [];
  timeLeft = size * 72;
  document.getElementById('btn-retry').onclick = () => startQuiz(lastSize);
  show('quiz');
  renderQuestion();
  startTimer();
}

function startTimer() {
  clearInterval(timerID);
  timerID = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) { clearInterval(timerID); autoFinish(); }
  }, 1000);
}

function autoFinish() {
  // If unanswered, record as wrong
  if (!confirmed && questions[current]) {
    answers.push({ correct: false });
  }
  showResults();
}

function updateTimer() {
  const el = document.getElementById('timer-display');
  const dot = document.getElementById('timer-dot');
  const total = questions.length * 72;
  const pct = timeLeft / total;
  const color = pct > 0.5 ? 'var(--green)' : pct > 0.25 ? 'var(--yellow)' : 'var(--red)';
  el.textContent = fmt(timeLeft);
  el.style.color = color;
  dot.style.background = color;
}

function renderQuestion() {
  const q = questions[current];
  const isMulti = q.a.includes(',');
  const correctKeys = q.a.split(',');

  // Progress
  const pct = (current / questions.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('q-counter').textContent = (current+1) + ' / ' + questions.length;
  document.getElementById('q-num-badge').textContent = 'Q' + q.n;
  document.getElementById('multi-badge').style.display = isMulti ? '' : 'none';
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('explanation-wrap').innerHTML = '';

  // Options
  const list = document.getElementById('options-list');
  list.innerHTML = '';
  for (const [key, val] of Object.entries(q.o)) {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.dataset.key = key;
    btn.innerHTML = `<span class="opt-key">${key}.</span><span>${val}</span><span class="opt-icon"></span>`;
    btn.onclick = () => handleSelect(key);
    list.appendChild(btn);
  }

  // Actions
  const row = document.getElementById('action-row');
  row.innerHTML = '';
  const conf = document.createElement('button');
  conf.className = 'btn-confirm';
  conf.id = 'btn-confirm';
  conf.textContent = 'Confirm Answer';
  conf.disabled = true;
  conf.onclick = handleConfirm;
  row.appendChild(conf);

  const skip = document.createElement('button');
  skip.className = 'btn-skip';
  skip.textContent = 'Skip';
  skip.onclick = () => {
    if (!confirmed) {
      answers.push({ correct: false });
      next();
    }
  };
  row.appendChild(skip);
}

function handleSelect(key) {
  if (confirmed) return;
  const q = questions[current];
  const isMulti = q.a.includes(',');

  if (isMulti) {
    if (!selected) selected = [];
    if (selected.includes(key)) selected = selected.filter(k => k !== key);
    else selected = [...selected, key];
  } else {
    selected = key;
  }

  // Update visuals
  document.querySelectorAll('.option-btn').forEach(btn => {
    const k = btn.dataset.key;
    btn.classList.remove('selected');
    if (isMulti ? (selected && selected.includes(k)) : selected === k) {
      btn.classList.add('selected');
    }
  });

  const hasSelection = isMulti ? (selected && selected.length > 0) : !!selected;
  document.getElementById('btn-confirm').disabled = !hasSelection;
}

function handleConfirm() {
  if (!selected) return;
  confirmed = true;
  const q = questions[current];
  const isMulti = q.a.includes(',');
  const correctKeys = q.a.split(',');

  const isCorrect = isMulti
    ? correctKeys.every(k => selected.includes(k)) && selected.length === correctKeys.length
    : selected === q.a;

  answers.push({ correct: isCorrect });

  // Style options
  document.querySelectorAll('.option-btn').forEach(btn => {
    const k = btn.dataset.key;
    const isC = correctKeys.includes(k);
    const isSel = isMulti ? (selected && selected.includes(k)) : selected === k;
    btn.classList.add('confirmed');
    const icon = btn.querySelector('.opt-icon');
    if (isC) { btn.classList.add('correct'); icon.textContent = '✓'; }
    else if (isSel && !isC) { btn.classList.add('wrong'); icon.textContent = '✗'; }
    else { btn.classList.add('dimmed'); }
  });

  // Explanation
  if (q.e) {
    const wrap = document.getElementById('explanation-wrap');
    wrap.innerHTML = `
      <div class="explanation-card">
        <button class="expl-toggle" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('span').textContent=this.nextElementSibling.classList.contains('open')?'▲':'▼'">
          <span style="display:flex;align-items:center;gap:6px">📖 <span>Explanation</span></span>
          <span>▼</span>
        </button>
        <div class="expl-body">${q.e}</div>
      </div>`;
  }

  // Swap button
  const row = document.getElementById('action-row');
  row.innerHTML = '';
  const nxt = document.createElement('button');
  nxt.className = 'btn-next';
  nxt.textContent = (current + 1 >= questions.length) ? 'See Results →' : 'Next →';
  nxt.onclick = () => {
    if (current + 1 >= questions.length) { clearInterval(timerID); showResults(); }
    else next();
  };
  row.appendChild(nxt);
}

function next() {
  current++;
  selected = null;
  confirmed = false;
  renderQuestion();
}

function showResults() {
  clearInterval(timerID);
  const score = answers.filter(a => a.correct).length;
  const total = answers.length;
  const pct = total > 0 ? Math.round(score / total * 100) : 0;
  const grade = pct >= 80 ? 'PASS' : pct >= 65 ? 'MARGINAL' : 'NEEDS WORK';
  const color = pct >= 80 ? 'var(--green)' : pct >= 65 ? 'var(--yellow)' : 'var(--red)';

  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-pct').style.color = color;
  document.getElementById('score-ring').style.borderColor = color;
  const gb = document.getElementById('grade-badge');
  gb.textContent = grade;
  gb.style.background = color === 'var(--green)' ? 'rgba(22,163,74,0.12)' : color === 'var(--yellow)' ? 'rgba(217,119,6,0.12)' : 'rgba(220,38,38,0.12)';
  gb.style.color = color;
  gb.style.border = `1px solid ${color}`;

  document.getElementById('r-correct').textContent = score;
  document.getElementById('r-wrong').textContent = total - score;
  document.getElementById('r-total').textContent = total;
  show('results');
}

function showHome() {
  clearInterval(timerID);
  show('home');
}

function show(name) {
  ['home','quiz','results'].forEach(s => {
    document.getElementById('screen-'+s).style.display = s === name ? (s === 'quiz' ? 'flex' : 'flex') : 'none';
  });
}

// ── INIT ──
loadQuestions().then(data => {
  ALL_Q = data;
  document.getElementById('loading').style.display = 'none';
  show('home');
}).catch(e => {
  document.getElementById('loading').innerHTML = '<p style="color:var(--red)">Failed to load questions. Please refresh.</p>';
  console.error(e);
});
</script>
</body>
